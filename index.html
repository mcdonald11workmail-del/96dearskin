    /* =====================================================

          #6D490D 24%,
          #B88927 50%,
          #75500F 76%,
          #2A1902 100%

    /* =====================================================
       GOLD SILK BACKGROUND
    ===================================================== */

    .silk {
      position: absolute;

      inset: -15%;

      width: 130%;
      height: 130%;

      pointer-events: none;

      z-index: -4;

      opacity: 0.98;

      filter: blur(1px);

      animation:
        silkMove 14s ease-in-out infinite alternate;
    }


    @keyframes silkMove {

      0% {
        transform:
          translate3d(-2%, -1%, 0)
          scale(1.03);
      }

      100% {
        transform:
          translate3d(2%, 1.5%, 0)
          scale(1.07);
      }

    }


    /* =====================================================
       VIGNETTE
    ===================================================== */

    .vignette {
      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: -2;

      background:
        radial-gradient(
          ellipse at center,
          transparent 30%,
          rgba(49, 29, 3, 0.12) 62%,
          rgba(27, 15, 1, 0.58) 100%
        );
    }


    /* =====================================================
       CENTER GOLD GLOW
    ===================================================== */

    .center-glow {
      position: absolute;

      width: 760px;
      height: 760px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 231, 166, 0.27),
          rgba(232, 190, 87, 0.09) 42%,
          transparent 72%
        );

      filter: blur(38px);

      z-index: -3;

      pointer-events: none;
    }


    /* =====================================================
       GOLD STARS
    ===================================================== */

    .star {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #FFF4D3;

      box-shadow:
        0 0 7px #FFF2C7,
        0 0 18px rgba(255, 226, 148, 0.90);

      opacity: 0.80;

      pointer-events: none;

      animation:
        starPulse 3s ease-in-out infinite;
    }


    .star::before,
    .star::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);
    }


    .star::before {
      width: 1px;
      height: 34px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(255, 241, 204, 0.95),
          transparent
        );
    }


    .star::after {
      width: 34px;
      height: 1px;

      background:
        linear-gradient(
          to right,
          transparent,
          rgba(255, 241, 204, 0.95),
          transparent
        );
    }


    .star-1 {
      top: 13%;
      left: 12%;
      animation-delay: 0s;
    }

    .star-2 {
      top: 22%;
      right: 13%;
      animation-delay: 1.1s;
    }

    .star-3 {
      bottom: 18%;
      left: 14%;
      animation-delay: 1.8s;
    }

    .star-4 {
      bottom: 13%;
      right: 13%;
      animation-delay: 0.6s;
    }


    @keyframes starPulse {

      0%,
      100% {
        opacity: 0.25;

        transform:
          scale(0.75)
          rotate(0deg);
      }

      50% {
        opacity: 1;

        transform:
          scale(1.2)
          rotate(12deg);
      }

    }

       GLASS CONTENT PANEL
    ===================================================== */

    .content {

      z-index: 5;

      width: min(100%, 650px);

      padding:

        50px;

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;

      background:

          145deg,
          rgba(112, 75, 12, 0.46),
          rgba(60, 35, 4, 0.31)
        );

      border:
        1px solid rgba(255, 232, 169, 0.30);

      border-radius: 32px;

      backdrop-filter:
        blur(17px)
        saturate(120%);

      -webkit-backdrop-filter:
        blur(17px)
        saturate(120%);

      box-shadow:
        0 28px 80px rgba(45, 27, 2, 0.30),
        0 8px 28px rgba(45, 27, 2, 0.18),
        0 0 45px rgba(255, 211, 105, 0.08),
        inset 0 1px 0 rgba(255, 242, 204, 0.20);

      overflow: hidden;
    }

    .content::before {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      border-radius: inherit;

      background:

          135deg,
          rgba(255, 244, 211, 0.16) 0%,
          rgba(255, 231, 166, 0.04) 31%,
          transparent 56%
